name: ThermoML archive cache

# Keeps the ThermoML archive (about 190 MB) in the cache of the repository, where the
# documentation build finds it (see Docs.yml), so that the build does not depend on the NIST
# servers, which sometimes stop sending to the machines of GitHub.
#
# A cache that is not used for 7 days is deleted by GitHub, and a cache that was saved by a
# pull request or a tag is only seen by that one. This workflow runs on the default branch
# twice a week: it restores the archive, which counts as using it, and only when there is none
# it installs it (a download that continues what the server interrupted) and saves it. Run it
# by hand ("Run workflow") to put the archive back as soon as NIST answers again. It does not
# build the documentation.

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  archive:
    name: ThermoML archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restore the ThermoML archive
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/share/ThermophysicalDB/thermoml
          key: thermoml-${{ runner.os }}-none
          restore-keys: |
            thermoml-${{ runner.os }}-
      - name: The archive is in the cache
        if: ${{ steps.restore.outputs.cache-matched-key != '' }}
        run: echo "Restored ${{ steps.restore.outputs.cache-matched-key }}; nothing to do."
      - uses: actions/checkout@v7
        if: ${{ steps.restore.outputs.cache-matched-key == '' }}
      - uses: julia-actions/setup-julia@v3
        if: ${{ steps.restore.outputs.cache-matched-key == '' }}
        with:
          version: "1"
      - name: Use Julia cache
        if: ${{ steps.restore.outputs.cache-matched-key == '' }}
        uses: julia-actions/cache@v3
      - name: Install the ThermoML archive
        # The package itself downloads it, checks its SHA-256 and writes the manifest.
        if: ${{ steps.restore.outputs.cache-matched-key == '' }}
        id: archive
        timeout-minutes: 20
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            using ThermophysicalDB
            manifest = ThermophysicalDB.ensure_archive(; update = :install)
            open(ENV["GITHUB_OUTPUT"], "a") do io
                println(io, "key=thermoml-", ENV["RUNNER_OS"], "-", manifest.version, "-", first(manifest.sha256, 12))
            end'
        env:
          THERMOPHYSICALDB_DOWNLOAD_TIMEOUT: "900" # seconds for each try
      - name: Save the ThermoML archive
        if: ${{ steps.archive.outputs.key != '' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.local/share/ThermophysicalDB/thermoml
          key: ${{ steps.archive.outputs.key }}
