name: Reusable test

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: "1"
      os:
        required: false
        type: string
        default: ubuntu-latest
      arch:
        required: false
        type: string
        # "default" means the architecture of the runner executing the job
        default: default
      suite:
        required: false
        type: string
        # What test/runtests.jl runs: full, no-quality (without Aqua and JET) or platform (only the
        # files that depend on the operating system)
        default: full
      allow_failure:
        required: false
        type: boolean
        default: false
      run_codecov:
        required: false
        type: boolean
        default: false
    secrets:
      # Not required: pull requests from forks and from Dependabot do not receive the secret
      codecov_token:
        required: false

jobs:
  test:
    name: "Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.suite }} - arch: ${{ inputs.arch }} - ${{ github.event_name }}"
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allow_failure }}
    env:
      CODECOV_TOKEN: ${{ secrets.codecov_token }}
      THERMOPHYSICALDB_TEST_SUITE: ${{ inputs.suite }}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.version }}
          arch: ${{ inputs.arch }}
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Instrumenting the code for coverage slows the tests down, so only the job that sends it
          # to Codecov does it
          coverage: ${{ inputs.run_codecov }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ inputs.run_codecov }}
      - uses: codecov/codecov-action@v7
        if: ${{ inputs.run_codecov && env.CODECOV_TOKEN != '' }}
        with:
          file: lcov.info
          token: ${{ secrets.codecov_token }}
